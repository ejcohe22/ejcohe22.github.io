<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Freezer — Asset Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #07101a; overflow-x: hidden; font-family: 'Courier New', monospace; }
  canvas { display: block; }
  #info {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(5,14,26,0.96);
    border-top: 1px solid rgba(84,200,255,0.2);
    padding: 14px 28px;
    display: flex; align-items: center; gap: 28px;
    min-height: 68px;
  }
  #info-name  { font-size: 13px; letter-spacing: 0.18em; color: #54c8ff; text-transform: uppercase; min-width: 200px; }
  #info-type  { font-size: 9px; letter-spacing: 0.2em; color: rgba(255,255,255,0.3); text-transform: uppercase; }
  #info-desc  { font-size: 11px; color: rgba(255,255,255,0.6); flex: 1; line-height: 1.6; }
  #info-state { font-size: 9px; letter-spacing: 0.15em; color: #7effc8; text-transform: uppercase; min-width: 100px; text-align: right; }
  #info-hint  { font-size: 9px; color: rgba(255,255,255,0.18); min-width: 180px; text-align: right; letter-spacing: 0.08em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">
  <div>
    <div id="info-name">click an entity</div>
    <div id="info-type">—</div>
  </div>
  <div id="info-desc">hover and click any entity to inspect it. space to cycle animation states.</div>
  <div id="info-state">—</div>
  <div id="info-hint">← → or A D to navigate</div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = canvas.width  = window.innerWidth;
let H = canvas.height = Math.max(820, window.innerHeight - 68);
window.addEventListener('resize', () => {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = Math.max(820, window.innerHeight - 68);
});

// ── Palette ─────────────────────────────────────────────────
const ICE   = '#54c8ff';
const SNOW  = '#e8f4ff';
const FROST = 'rgba(200,230,255,0.22)';
const NAVY  = '#2a3a5c';
const GOLD  = '#c8a000';
const OFF_W = '#f8f8f0';

// ── Entity registry ──────────────────────────────────────────
const ROWS = () => [H * 0.26, H * 0.53, H * 0.78];
const COLS = () => [0.1, 0.3, 0.5, 0.7, 0.9].map(f => W * f);

const ENTITIES = [
  // Row 0 — Characters
  { id:'player',   row:0, col:0, label:'PLAYER',         sub:'scale reference · 18×42px',    type:'character',     desc:"Standard stick figure. Purple-glowing. This is you. The servers need you.",                    states:['idle','run','jump'] },
  { id:'midnight', row:0, col:1, label:'MIDNIGHT',       sub:'NPC · friendly · unkillable',   type:'character',     desc:"She is already in the Freezer when you arrive. She doesn't explain how. She gives you a blunt. moo.", states:['idle','moo','give'] },
  { id:'memo',     row:0, col:2, label:'THE MEMO',       sub:'enemy · flying · 35 HP',        type:'enemy',         desc:"Angry paperwork. Floats. Has strong opinions about your time management. Throws paperclips.",       states:['idle','attack'] },
  { id:'cold',     row:0, col:3, label:'COLD SHOULDER',  sub:'enemy · walking · 55 HP',       type:'enemy',         desc:"Frozen corporate zombie. Slow. Hits hard. Emits frost that slows the player on contact.",           states:['idle','walk'] },
  { id:'director', row:0, col:4, label:'THE DIRECTOR',   sub:'boss · 350 HP · 2 phases',      type:'boss',          desc:"The Board's representative. Has a briefcase. Has opinions. Both are weaponized. Phase 2: hair loose, moves faster, throws spreadsheet fans.", states:['phase1','phase2','attack'] },
  // Row 1 — Items
  { id:'thermos',     row:1, col:0, label:'COFFEE THERMOS',    sub:'health · +40 HP',              type:'item-health',   desc:"Hot coffee at -4°F. The most valuable object in the building. Glows warm teal when on the ground.",                     states:['idle'] },
  { id:'blunt',       row:1, col:1, label:'BLUNT',              sub:"Midnight's gift · 15s buff",    type:'item-buff',     desc:"Speed +40%. Damage +20%. 15 seconds. Midnight drops one per realm. No explanation offered.",                           states:['idle'] },
  { id:'parka',       row:1, col:2, label:'PARKA',              sub:'armor · cold resistance',       type:'item-armor',    desc:"Reduces Director freeze attack and Wisconsin slow-field by 60%. Player gets a parka sprite overlay when equipped.",       states:['idle','worn'] },
  { id:'shovel',      row:1, col:3, label:'SNOW SHOVEL',        sub:'weapon · wide arc sweep',       type:'item-weapon',   desc:"Slower than sword but wide arc. Knocks spreadsheet projectiles out of the air. Every Midwesterner has one.",            states:['idle','swing'] },
  { id:'sheet',       row:1, col:4, label:'SPREADSHEET',        sub:"Director's projectile · 18 dmg", type:'projectile',   desc:"Q3 Actuals vs Q3 Budget. Aimed directly at your face. Tumbles through the air. Hits harder than it has any right to.", states:['fly','burst'] },
  // Row 2 — Props & Artifacts
  { id:'platform', row:2, col:0, label:'ICE PLATFORM',      sub:'terrain · slippery surface',     type:'prop',          desc:"Standard Freezer floor segment. Cracks radiate from the center. Icicles hang from the bottom edge. Slightly slippery.",  states:['idle'] },
  { id:'server',   row:2, col:1, label:'FROZEN SERVER',     sub:'env · still running somehow',    type:'prop',          desc:"Been running since before the freeze. Encased in ice. One LED blinks green. Steady. The servers are still up.",           states:['idle'] },
  { id:'pizza',    row:2, col:2, label:'FROZEN PIZZA',      sub:'joke artifact · break room',     type:'artifact-joke', desc:'"BREAK ROOM · 4:12 AM." Same pizza as always. Same time as always. Nobody ate it. Nobody ever eats it.',                  states:['idle'] },
  { id:'badge',    row:2, col:3, label:'EMPLOYEE BADGE',    sub:'pain artifact · frozen in ice',  type:'artifact-pain', desc:'J. KOWALSKI · Infrastructure · Started: March 2019. The ice got to them before the exit sign did.',                     states:['idle'] },
  { id:'backup',   row:2, col:4, label:'erik_backup_2019', sub:'story prop · warm inside ice',   type:'artifact-key',  desc:"Found on level 3. The filename glows amber through the ice. Why is it here. Why is it warm.",                          states:['idle'] },
];

let selectedIdx  = -1;
let animStates   = Object.fromEntries(ENTITIES.map(e => [e.id, 0]));
let t = 0;
let snow = Array.from({length:180}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random()*2.2+0.4, speed: Math.random()*0.0006+0.0001,
  drift: (Math.random()-0.5)*0.0003,
}));

// ── Input ───────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.key === ' ') {
    if (selectedIdx >= 0) {
      const en = ENTITIES[selectedIdx];
      animStates[en.id] = (animStates[en.id] + 1) % en.states.length;
      updateInfoBar();
    }
    e.preventDefault();
  }
  if (e.key === 'ArrowLeft' || e.key === 'a')  { selectedIdx = Math.max(0, selectedIdx < 0 ? 0 : selectedIdx - 1); updateInfoBar(); }
  if (e.key === 'ArrowRight'|| e.key === 'd')  { selectedIdx = Math.min(ENTITIES.length-1, selectedIdx < 0 ? 0 : selectedIdx + 1); updateInfoBar(); }
});

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const cols = COLS(), rows = ROWS();
  const PW = 80, PH = 88;
  ENTITIES.forEach((en, i) => {
    const cx = cols[en.col], cy = rows[en.row];
    if (mx >= cx-PW && mx <= cx+PW && my >= cy-PH && my <= cy+PH) {
      selectedIdx = i;
      updateInfoBar();
    }
  });
});

function updateInfoBar() {
  if (selectedIdx < 0) return;
  const en = ENTITIES[selectedIdx];
  const si = animStates[en.id];
  document.getElementById('info-name').textContent  = en.label;
  document.getElementById('info-type').textContent  = en.type.replace('-',' ');
  document.getElementById('info-desc').textContent  = en.desc;
  document.getElementById('info-state').textContent = `state: ${en.states[si]}`;
}

// ── Draw helpers ─────────────────────────────────────────────
function glow(color, blur=10) { ctx.shadowColor=color; ctx.shadowBlur=blur; }
function noGlow()              { ctx.shadowColor='transparent'; ctx.shadowBlur=0; }
function limb(x1,y1,x2,y2,w,color) {
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}

// ── CHARACTER DRAWS ──────────────────────────────────────────
function drawPlayer(cx, cy, state) {
  const fy = cy + 45;
  const bob  = Math.sin(t*0.06)*1.5;
  const run  = state==='run';
  const jump = state==='jump';
  const lSin = run ? Math.sin(t*0.12)*12 : 0;
  const aSwing = run ? Math.sin(t*0.12)*10 : Math.sin(t*0.04)*4;

  ctx.save(); ctx.translate(cx, fy + (jump ? -20 : bob));
  // shadow
  ctx.fillStyle='rgba(201,126,255,0.2)'; ctx.beginPath(); ctx.ellipse(0,jump?20:0,9,3,0,0,Math.PI*2); ctx.fill();
  glow('#c97eff', 10);
  const C='#eeeef8', W2=2.5;
  limb(0,-18, -7+(run?lSin*0.5:0), 0, W2, C);
  limb(0,-18,  7-(run?lSin*0.5:0), 0, W2, C);
  limb(0,-18, 0, -33, W2, C);
  limb(0,-28, -12, -18+aSwing, W2, C);
  limb(0,-28,  12, -18-aSwing, W2, C);
  ctx.strokeStyle=C; ctx.lineWidth=W2; ctx.beginPath(); ctx.arc(0,-40,7,0,Math.PI*2); ctx.stroke();
  noGlow(); ctx.restore();
}

function drawMidnight(cx, cy, state) {
  const fy = cy + 44;
  const breathe = Math.sin(t*0.025)*1.5;
  const tailSwing = Math.sin(t*0.04)*20;
  const legBob = Math.sin(t*0.03)*2.5;
  const doMoo = state==='moo';
  const doGive = state==='give';
  const mouthOpen = doMoo ? Math.abs(Math.sin(t*0.08))*7 : 0;

  ctx.save(); ctx.translate(cx, fy);
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(0,0,42,6,0,0,Math.PI*2); ctx.fill();
  // legs
  ctx.strokeStyle='#c0c0b8'; ctx.lineWidth=3.5; ctx.lineCap='round';
  [[-22,0],[-8,0],[8,0],[22,0]].forEach(([lx],i) => {
    const b = i%2===0?legBob:-legBob;
    ctx.beginPath(); ctx.moveTo(lx,-6); ctx.lineTo(lx, 18+b); ctx.stroke();
    // hooves
    ctx.fillStyle='#888'; ctx.beginPath(); ctx.ellipse(lx, 19+b, 5, 3, 0, 0, Math.PI*2); ctx.fill();
  });
  // udder
  ctx.fillStyle='#f0c8c8'; ctx.beginPath(); ctx.ellipse(5,-9+breathe,12,7,0,0,Math.PI*2); ctx.fill();
  // body
  ctx.fillStyle=OFF_W; ctx.strokeStyle='#c8c8c0'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(5,-26+breathe, 44, 28, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // spots
  ctx.fillStyle='#1a1a18';
  ctx.beginPath(); ctx.ellipse(-4,-30+breathe,13,8,0.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(26,-20+breathe,9,6,-0.3,0,Math.PI*2); ctx.fill();
  // head
  ctx.fillStyle=OFF_W; ctx.strokeStyle='#c8c8c0'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(-40,-32+breathe, 21, 16, -0.15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // ears
  ctx.fillStyle='#f0e8e0';
  ctx.beginPath(); ctx.ellipse(-46,-43+breathe,5,9,-0.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-34,-45+breathe,5,9,0.4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#e8bbbb';
  ctx.beginPath(); ctx.ellipse(-46,-43+breathe,2.5,5,-0.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-34,-45+breathe,2.5,5,0.4,0,Math.PI*2); ctx.fill();
  // horns
  ctx.strokeStyle='#c8a060'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(-47,-46+breathe); ctx.quadraticCurveTo(-53,-56,-48,-61); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-33,-48+breathe); ctx.quadraticCurveTo(-30,-58,-25,-60); ctx.stroke();
  // eye + shine
  ctx.fillStyle='#1a1a18'; ctx.beginPath(); ctx.arc(-44,-33+breathe,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(-42,-35+breathe,1,0,Math.PI*2); ctx.fill();
  // nose
  ctx.fillStyle='#e0aaaa'; ctx.beginPath(); ctx.arc(-54,-28+breathe,3,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#bb8888'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-56,-26+breathe); ctx.lineTo(-54,-25+breathe); ctx.lineTo(-52,-26+breathe); ctx.stroke();
  // mouth (moo)
  if (doMoo) {
    ctx.fillStyle='#881100';
    ctx.beginPath(); ctx.ellipse(-52,-24+breathe+mouthOpen/2, 4, mouthOpen/2+1, 0, 0, Math.PI*2); ctx.fill();
  }
  // tail
  ctx.strokeStyle='#f0f0e8'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(49,-24+breathe); ctx.quadraticCurveTo(62,-18+breathe+tailSwing*0.2, 60,-40+breathe+tailSwing); ctx.stroke();
  ctx.fillStyle='#e0e0d8'; ctx.beginPath(); ctx.arc(60,-40+breathe+tailSwing,6,0,Math.PI*2); ctx.fill();
  // give: blunt in front of nose
  if (doGive) {
    ctx.save(); ctx.translate(-60,-28+breathe); ctx.rotate(0.4);
    glow('#88ff88',8);
    ctx.fillStyle='#c8a060'; ctx.fillRect(-9,-2,18,4);
    ctx.fillStyle='#55aa33'; ctx.beginPath(); ctx.arc(-11,0,5,0,Math.PI*2); ctx.fill();
    noGlow(); ctx.restore();
  }
  // cold breath
  const bf = t % 100;
  if (bf < 28) {
    const a = bf<14 ? bf/14*0.38 : (28-bf)/14*0.38;
    ctx.fillStyle=`rgba(200,225,255,${a})`;
    ctx.beginPath(); ctx.ellipse(-62,-26+breathe, 10+bf*0.35, 5, -0.2, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawMemo(cx, cy, state) {
  const fy = cy + 20;
  const wobble = Math.sin(t*0.07)*5;
  const tilt   = Math.sin(t*0.05)*0.14;
  const atk    = state==='attack';
  const spin   = atk ? t*0.15 : tilt;

  ctx.save(); ctx.translate(cx, fy + wobble); ctx.rotate(spin);
  glow('#ff4466', 12);
  // body
  ctx.fillStyle='#eeeedc'; ctx.strokeStyle='#bbbbaa'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(-20,-15,40,30,2); ctx.fill(); ctx.stroke();
  // flap
  ctx.fillStyle='#ddddcc';
  ctx.beginPath(); ctx.moveTo(-20,-15); ctx.lineTo(0,0); ctx.lineTo(20,-15); ctx.closePath(); ctx.fill(); ctx.stroke();
  // seal dot
  ctx.fillStyle='#ff2200'; glow('#ff2200',6);
  ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill(); noGlow();
  // eyes
  ctx.fillStyle='#ff2200';
  ctx.beginPath(); ctx.arc(-7,10,4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 7,10,4,0,Math.PI*2); ctx.fill();
  // eyebrows
  ctx.strokeStyle='#cc1100'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(-11,5); ctx.lineTo(-5,8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(11,5);  ctx.lineTo(5,8);  ctx.stroke();
  // paper trail
  [1,2,3].forEach(i => {
    const px = -20 - i*10 - Math.sin(t*0.04+i)*3;
    const py = -i*4 + Math.cos(t*0.06+i)*3;
    const pa = 0.5 - i*0.12;
    ctx.fillStyle=`rgba(220,220,200,${pa})`;
    ctx.save(); ctx.translate(px,py); ctx.rotate(-0.2-i*0.1); ctx.fillRect(-8,-5,16,10); ctx.restore();
  });
  noGlow(); ctx.restore();
}

function drawColdShoulder(cx, cy, state) {
  const fy = cy + 45;
  const walk = state==='walk';
  const lSin = walk ? Math.sin(t*0.03)*12 : 0;
  const aSwing = walk ? Math.sin(t*0.03)*8 : 0;

  ctx.save(); ctx.translate(cx, fy);
  // ice aura
  glow(ICE, 14);
  ctx.fillStyle='rgba(84,200,255,0.06)';
  ctx.beginPath(); ctx.ellipse(0,-22,28,38,0,0,Math.PI*2); ctx.fill(); noGlow();
  // shadow
  ctx.fillStyle='rgba(84,200,255,0.12)'; ctx.beginPath(); ctx.ellipse(0,0,14,4,0,0,Math.PI*2); ctx.fill();
  // legs
  limb(0,-10, -8, 0+lSin*0.4, 3.5, '#445566');
  limb(0,-10,  8, 0-lSin*0.4, 3.5, '#445566');
  // suit torso
  ctx.fillStyle='#445566';
  ctx.beginPath(); ctx.roundRect(-12,-38,24,28,2); ctx.fill();
  // frost overlay on suit
  ctx.fillStyle='rgba(180,220,255,0.25)';
  ctx.beginPath(); ctx.roundRect(-12,-38,24,28,2); ctx.fill();
  // shirt collar
  ctx.fillStyle='#f0f0e8'; ctx.fillRect(-3,-38,6,8);
  // tie (slightly askew)
  ctx.fillStyle='#336655'; ctx.save(); ctx.translate(0,-34); ctx.rotate(0.12);
  ctx.beginPath(); ctx.moveTo(-2,0); ctx.lineTo(2,0); ctx.lineTo(1.5,16); ctx.lineTo(-1.5,16); ctx.closePath(); ctx.fill(); ctx.restore();
  // arms
  limb(-12,-32, -22,-18+aSwing, 3.5, '#445566');
  limb( 12,-32,  22,-18-aSwing, 3.5, '#445566');
  // neck
  limb(0,-38, 0,-45, 3.5, '#c0c8d0');
  // head
  ctx.fillStyle='#c0c8d0'; ctx.strokeStyle='#99aabb'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0,-52,8,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // frost cracks on face
  ctx.strokeStyle='rgba(180,220,255,0.5)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-3,-56); ctx.lineTo(-1,-50); ctx.lineTo(-5,-47); ctx.stroke();
  // eyes (icy blue)
  ctx.fillStyle='#99ddff';
  ctx.beginPath(); ctx.arc(-3,-52,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 3,-52,2,0,Math.PI*2); ctx.fill();
  // cold breath (every 70 frames)
  const bf = t%70;
  if (bf<22) {
    const a = bf<11 ? bf/11*0.35 : (22-bf)/11*0.35;
    ctx.fillStyle=`rgba(200,230,255,${a})`;
    ctx.beginPath(); ctx.ellipse(12,-50, 10+bf*0.4, 5, 0.2, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawDirector(cx, cy, state) {
  const fy = cy + 58;
  const sc = 0.65;
  const breathe = Math.sin(t*0.025)*1.5;
  const sway    = Math.sin(t*0.018)*2;
  const p2      = state==='phase2';
  const atk     = state==='attack';
  const watchLift = (t%200 > 160) ? Math.sin((t%200-160)/40*Math.PI)*14 : 0;

  ctx.save(); ctx.translate(cx + sway*sc, fy); ctx.scale(sc, sc);
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0,0,32,8,0,0,Math.PI*2); ctx.fill();
  // legs
  const lSin = atk ? Math.sin(t*0.12)*8 : 0;
  limb(0,-8,  -14, 24+lSin, 6, '#1a2a3a');
  limb(0,-8,   14, 24-lSin, 6, '#1a2a3a');
  // shoes
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.ellipse(-14,27+lSin, 11,4, 0.1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 14,27-lSin, 11,4,-0.1,0,Math.PI*2); ctx.fill();
  // suit torso
  ctx.fillStyle = p2 ? '#3a2a4c' : NAVY;
  ctx.beginPath(); ctx.roundRect(-19,-52+breathe,38,44,3); ctx.fill();
  // lapels
  ctx.fillStyle = p2 ? '#4a3860' : '#344466';
  ctx.beginPath(); ctx.moveTo(-19,-52+breathe); ctx.lineTo(0,-36+breathe); ctx.lineTo(-12,-52+breathe); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo( 19,-52+breathe); ctx.lineTo(0,-36+breathe); ctx.lineTo( 12,-52+breathe); ctx.closePath(); ctx.fill();
  // shirt strip
  ctx.fillStyle='#f0f0f8';
  ctx.beginPath(); ctx.moveTo(-5,-52+breathe); ctx.lineTo(0,-36+breathe); ctx.lineTo(5,-52+breathe); ctx.closePath(); ctx.fill();
  // tie
  const tieTilt = p2 ? Math.sin(t*0.06)*0.35 : 0;
  ctx.save(); ctx.translate(0,-44+breathe); ctx.rotate(tieTilt);
  ctx.fillStyle='#bb1111';
  ctx.beginPath(); ctx.moveTo(-3,0); ctx.lineTo(3,0); ctx.lineTo(2.5,30); ctx.lineTo(-2.5,30); ctx.closePath(); ctx.fill();
  // tie knot
  ctx.fillStyle='#991111';
  ctx.beginPath(); ctx.moveTo(-4,0); ctx.lineTo(4,0); ctx.lineTo(3,5); ctx.lineTo(-3,5); ctx.closePath(); ctx.fill();
  ctx.restore();
  // pocket square
  ctx.fillStyle='#f0f0f8'; ctx.fillRect(-17,-50+breathe,8,5);
  // briefcase arm (left)
  const caseSwing = Math.sin(t*0.03)*8;
  limb(-20,-44+breathe, -34,-20+caseSwing, 6, NAVY);
  // briefcase
  const bcy = -20+caseSwing;
  glow(GOLD, atk?20:8);
  ctx.fillStyle=GOLD; ctx.strokeStyle='#a08000'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(-54,bcy-12,30,22,3); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#a08000'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(-39,bcy-12,8,Math.PI,0); ctx.stroke();
  ctx.fillStyle='#888800'; ctx.fillRect(-48,bcy+2,8,5); ctx.fillRect(-36,bcy+2,8,5);
  ctx.fillStyle='#555'; ctx.fillRect(-43,bcy+6,8,4);
  noGlow();
  // right arm (watch lift)
  limb( 20,-44+breathe,  32,-22-watchLift, 6, NAVY);
  // watch
  if (watchLift > 5) {
    ctx.fillStyle='#888'; ctx.strokeStyle='#666'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.rect(28,-24-watchLift,9,6); ctx.fill(); ctx.stroke();
  }
  // neck
  limb(0,-52+breathe, 0,-62, 5, '#d8c8b8');
  // head
  ctx.fillStyle='#e0d0c0'; ctx.strokeStyle='#c0b0a0'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0,-74,15,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // hair
  ctx.strokeStyle='#111'; ctx.lineWidth=2.5;
  if (!p2) {
    // slicked
    ctx.beginPath(); ctx.moveTo(-12,-84); ctx.quadraticCurveTo(0,-90,13,-83); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-12,-81); ctx.quadraticCurveTo(2,-88,13,-80); ctx.stroke();
  } else {
    // wild
    for (let i=0;i<7;i++) {
      const hx=-13+i*4.5, rnd=Math.sin(t*0.05+i)*4;
      ctx.beginPath(); ctx.moveTo(hx,-84); ctx.lineTo(hx+rnd,-96-Math.abs(Math.sin(i*1.3))*6); ctx.stroke();
    }
  }
  // glasses
  ctx.strokeStyle='#555'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.rect(-10,-77,9,6); ctx.stroke();
  ctx.beginPath(); ctx.rect(1,-77,9,6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-1,-74); ctx.lineTo(1,-74); ctx.stroke();
  // eyes
  ctx.fillStyle='#222';
  ctx.beginPath(); ctx.arc(-5,-74,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 5,-74,2,0,Math.PI*2); ctx.fill();
  // mouth (slight smirk)
  ctx.strokeStyle='#9a7060'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0,-68,5, 0.2, Math.PI-0.2); ctx.stroke();
  // attack: open briefcase + spreadsheet fan
  if (atk) {
    glow('#ff4466', 14);
    for (let i=-2; i<=2; i++) {
      ctx.save(); ctx.translate(-39, bcy); ctx.rotate(i*0.3 - 0.8 + Math.sin(t*0.1)*0.15);
      ctx.fillStyle='rgba(240,240,220,0.88)'; ctx.strokeStyle='#aaaaaa'; ctx.lineWidth=0.8;
      ctx.beginPath(); ctx.rect(0,-8,28,16); ctx.fill(); ctx.stroke();
      // grid lines
      for (let g=1;g<4;g++) { ctx.beginPath(); ctx.moveTo(g*7,-8); ctx.lineTo(g*7,8); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(28,0); ctx.stroke();
      ctx.restore();
    }
    noGlow();
  }
  ctx.restore();
}

function drawThermos(cx, cy) {
  ctx.save(); ctx.translate(cx, cy);

  ctx.fillStyle='#aaaaaa'; ctx.strokeStyle='#888'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(-10,-28,20,50,[4,4,2,2]); ctx.fill(); ctx.stroke();
  // top cap
  ctx.fillStyle='#cc2222'; ctx.beginPath(); ctx.roundRect(-8,-38,16,12,[3,3,0,0]); ctx.fill(); ctx.stroke();
  // band
  ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(-10,-14,20,6);
  // + label
  ctx.fillStyle='#7effc8'; ctx.font='bold 16px monospace'; ctx.textAlign='center';
  ctx.fillText('+', 0, 10);
  // steam
  for (let s=0;s<3;s++) {
    const sf = (t*0.04 + s*1.2) % (Math.PI*2);
    const sy = -38 - Math.sin(sf)*8 - s*8;
    const sx = Math.sin(sf*0.7)*5 + s*3-3;
    const sa = Math.max(0, 1 - sf/(Math.PI*2)) * 0.5;
    ctx.fillStyle=`rgba(200,230,255,${sa})`;
    ctx.beginPath(); ctx.arc(sx, sy, 4-s*0.8, 0, Math.PI*2); ctx.fill();
  }
  noGlow(); ctx.restore();
}

function drawBlunt(cx, cy) {

// ── Panel rendering ──────────────────────────────────────────
const TYPE_COLORS = {
  character:'#c97eff', enemy:'#ff6644', boss:'#ff2244',
  'item-health':'#7effc8', 'item-buff':'#88ff88', 'item-armor':'#ffaa44', 'item-weapon':'#aaaaff',
  projectile:'#ff4466', prop:'#54c8ff', 'artifact-joke':'#ffd966', 'artifact-pain':'#ff8888', 'artifact-key':'#ffcc66',
};

function drawPanel(en, i) {
  const cols = COLS(), rows = ROWS();
  const cx = cols[en.col], cy = rows[en.row];
  const PW=80, PH=88;
  const sel = selectedIdx === i;
  const tc  = TYPE_COLORS[en.type] || '#ffffff';
  const si  = animStates[en.id];
  const state = en.states[si];

  ctx.save();
  // card bg
  ctx.fillStyle = sel ? 'rgba(84,200,255,0.08)' : 'rgba(10,22,44,0.72)';
  ctx.strokeStyle = sel ? ICE : 'rgba(84,200,255,0.18)';
  ctx.lineWidth = sel ? 1.5 : 1;
  ctx.beginPath(); ctx.roundRect(cx-PW, cy-PH, PW*2, PH*2, 4); ctx.fill(); ctx.stroke();

  // draw the entity
  ctx.save();
  ctx.beginPath(); ctx.roundRect(cx-PW, cy-PH, PW*2, PH*2, 4); ctx.clip();
  switch(en.id) {
    case 'player':      drawPlayer(cx, cy, state); break;
    case 'midnight':    drawMidnight(cx, cy, state); break;
    case 'memo':        drawMemo(cx, cy, state); break;
    case 'cold':        drawColdShoulder(cx, cy, state); break;
    case 'director':    drawDirector(cx, cy, state); break;
    case 'thermos':     drawThermos(cx, cy); break;
    case 'blunt':       drawBlunt(cx, cy); break;
    case 'parka':       drawParka(cx, cy, state); break;
    case 'shovel':      drawSnowShovel(cx, cy, state); break;
    case 'sheet':       drawSpreadsheet(cx, cy, state); break;
    case 'platform':    drawIcePlatform(cx, cy); break;
    case 'server':      drawFrozenServer(cx, cy); break;
    case 'pizza':       drawFrozenPizza(cx, cy); break;
    case 'badge':       drawEmployeeBadge(cx, cy); break;
    case 'backup':      drawBackupFile(cx, cy); break;
  }
  ctx.restore();

  // label below card
  ctx.fillStyle = sel ? tc : 'rgba(255,255,255,0.55)';
  ctx.font = `bold ${sel?11:10}px 'Courier New'`;
  ctx.textAlign = 'center';
  ctx.fillText(en.label, cx, cy + PH + 16);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.font = `8px 'Courier New'`;
  ctx.fillText(en.sub, cx, cy + PH + 28);

  // state indicator dots
  if (en.states.length > 1) {
    en.states.forEach((_, di) => {
      ctx.fillStyle = di===si ? tc : 'rgba(255,255,255,0.2)';
      ctx.beginPath(); ctx.arc(cx - (en.states.length-1)*5 + di*10, cy+PH+38, 2.5, 0, Math.PI*2); ctx.fill();
    });
  }

  // type tag
  ctx.fillStyle = tc + '44'; // transparent bg
  ctx.fillRect(cx-PW+4, cy-PH+4, 72, 13);
  ctx.fillStyle = tc; ctx.font=`7px 'Courier New'`; ctx.textAlign='left';
  ctx.fillText(en.type.replace('-',' ').toUpperCase(), cx-PW+7, cy-PH+13);

  ctx.restore();
}

// ── Background snow ──────────────────────────────────────────
function drawBackground() {
  // sky gradient
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#060e1a');
  grad.addColorStop(1, '#0d1825');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  // snowflakes
  snow.forEach(s => {
    s.y += s.speed; s.x += s.drift;
    if (s.y > 1) { s.y = 0; s.x = Math.random(); }
    if (s.x > 1 || s.x < 0) { s.x = Math.random(); }
    const sx = s.x * W, sy = s.y * H;
    ctx.fillStyle = `rgba(200,220,255,${0.15+s.r*0.1})`;
    ctx.beginPath(); ctx.arc(sx, sy, s.r*0.7, 0, Math.PI*2); ctx.fill();
  });
}

// ── Row labels ───────────────────────────────────────────────
function drawSectionLabels() {
  const rows = ROWS();
  [['CHARACTERS', rows[0]-96], ['ITEMS & WEAPONS', rows[1]-96], ['PROPS & ARTIFACTS', rows[2]-96]].forEach(([label, y]) => {
    ctx.fillStyle = 'rgba(84,200,255,0.35)';
    ctx.fillRect(24, y, W-48, 1);
    ctx.fillStyle = 'rgba(84,200,255,0.45)'; ctx.font=`10px 'Courier New'`; ctx.textAlign='left';
    ctx.fillText(label, 28, y-5);
  });
}

// ── Header ───────────────────────────────────────────────────
function drawHeader() {
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.font=`10px 'Courier New'`; ctx.textAlign='left';
  ctx.fillText('realm/the-freezer', 28, 24);
  glow(ICE, 12);
  ctx.fillStyle = SNOW; ctx.font=`bold 18px 'Courier New'`; ctx.textAlign='left';
  ctx.fillText('THE FREEZER — ASSET PREVIEW', 28, 48);
  noGlow();
  ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.font=`9px 'Courier New'`; ctx.textAlign='right';
  ctx.fillText('[space] cycle states  ·  [a/d] navigate  ·  click to inspect', W-28, 48);
}

// ── Main loop ────────────────────────────────────────────────
function loop() {
  t++;
  drawBackground();
  drawHeader();
  drawSectionLabels();
  ENTITIES.forEach((en, i) => drawPanel(en, i));
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
